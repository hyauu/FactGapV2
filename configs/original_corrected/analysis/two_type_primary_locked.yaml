endpoints:
  - {endpoint: R1-BGE, claim: R1, model_or_pipeline: bge-base, tau: 0.05}
  - {endpoint: R1-E5, claim: R1, model_or_pipeline: e5-base, tau: 0.05}
  - {endpoint: R2-BGE-reranker, claim: R2, model_or_pipeline: bge-reranker, tau: 0.10}
